# ============================================================================
# racecar 的 nav2 参数文件 —— 面向「本仓库的 ROS2 兼容层 + 移植的 nav2」。
#
# 用法（兼容层，Windows 与 Ubuntu 同一份文件、同一条命令）：
#
#     python bridge/scripts/run_nav2_stack.py --params <本文件> --no-overrides
#     python bridge/scripts/run_nav2_stack.py --params <本文件> --no-overrides --goal 3.5,-2
#
# racecar/nav.sh（Linux）与 racecar/nav.bat（Windows）包的就是上面这条命令。
# `--no-overrides` 的意思是「这一份就是全部配置」：nav2_shim_overrides.yaml 里
# 那几项兼容层专用设置（use_sim_time / enable_stamped_cmd_vel / 行为树路径 /
# lifecycle_manager）本文件已经自带，再叠一层只会把它们重复一遍。
#
# 本文件与真车（RDK，ROS2 Humble）共用一份，不同之处都在带「兼容层」字样的注释里，
# 说到底是六件事：
#   * use_sim_time 全为 True      —— 兼容层上每条消息盖的都是仿真时钟的戳
#   * base_footprint -> base_link —— 仿真里的机器人底座就叫 base_link
#   * odom_combined  -> odom      —— 真车的 odom_combined 来自 EKF，仿真直接发 odom
#   * odom_topic 写成话题名 /odom
#   * controller_server / behavior_server 的 enable_stamped_cmd_vel: false
#   * bt_navigator 的行为树 XML 取自 NAV2_SHIM_BT_DIR，超时放宽到 1000 ms
# 另外文件末尾补了 lifecycle_manager 段：上游那份 nav2_params.yaml 里没有它，
# 是 nav2_bringup 的 launch 文件传进去的，兼容层上没有任何 launch，只能写在这里。
# 真车的取值都留在对应条目的注释里，改回去即可；真车仍由 Run_nav.launch.py 加载本文件。
#
# 参数说明：https://docs.nav2.org/configuration/packages/
# ============================================================================

amcl:
  ros__parameters:
    use_sim_time: True                      # 兼容层：真车 false
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_link"              # 兼容层/仿真：真车是 base_footprint
    beam_skip_distance: 0.4         #忽略似然场模型中大多数粒子不同意的光束。考虑跳过的最大距离（米）
    beam_skip_error_threshold: 0.9  #由于收敛性不好，未匹配地图后强制进行完全更新的光束百分比
    beam_skip_threshold: 0.3        #需要跳过的光束的百分比。
    do_beamskip: false              #是否在似然场模型中进行波束跳跃
    global_frame_id: "map"          #定位系统发布的坐标框架的名称
    lambda_short: 0.1               #模型 z_short 部分的指数衰减参数
    laser_likelihood_max_dist: 2.0  #在地图上进行障碍物膨胀的最大距离，用于似然场模型
    laser_max_range: 12.0           #兼容层：仿真雷达 range_max = 12.0（真车 20.0）；-1.0 表示用雷达自报的量程
    laser_min_range: 0.2            #要考虑的最小扫描范围，-1.0 将导致使用激光报告的最小范围
    laser_model_type: "likelihood_field" #使用哪种模型，
    max_beams: 60                   #更新过滤器时每次扫描要使用多少个均匀分布的光束。
    max_particles: 2000             #允许的最大粒子数
    min_particles: 500              #允许的最小粒子数
    odom_frame_id: "odom"           #兼容层/仿真：真车是 EKF 的 odom_combined
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0        #快速平均权重过滤器的指数衰减率，用于决定何时通过添加随机姿势进行恢复。
    recovery_alpha_slow: 0.0        #慢速平均权重过滤器的指数衰减率，用于决定何时通过添加随机姿势进行恢复。
    resample_interval: 1            #重采样之前所需的过滤器更新次数
    robot_model_type: "nav2_amcl::DifferentialMotionModel" #插件类的完全限定类型。
    #选项为“nav2_amcl::DifferentialMotionModel”和“nav2_amcl::OmniMotionModel”。
    save_pose_rate: 0.0             #兼容层：真车 0.5；兼容层上没有参数落盘的去处，写了也只是白写
    sigma_hit: 0.2                 #模型的 z_hit 部分中使用的高斯模型的标准差
    tf_broadcast: true              #将其设置为 false 以防止 amcl 发布全局框架和里程计框架之间的变换
    transform_tolerance: 0.3        #发布转换的容差
    update_min_a: 0.06              #执行过滤器更新之前需要进行旋转运动。
    update_min_d: 0.025             #执行过滤器更新之前需要进行平移运动
    z_hit: 0.7
    z_rand: 0.059
    z_short: 0.24
    scan_topic: /scan               #要订阅的激光雷达

    set_initial_pose: True          #AMCL 从 initial_pose* 参数设置初始姿势，而不是等待 initial_pose 消息
    initial_pose.x: 0.0
    initial_pose.y: 0.0
    initial_pose.z: 0.0
    initial_pose.yaw: 0.0

    first_map_only: True            #兼容层：地图由桥从对面镜像进来，不重载既有 /map

    #Amcl参数解释参考：https://docs.nav2.org/configuration/packages/configuring-amcl.html

amcl_map_client:
  ros__parameters:
    use_sim_time: True

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: True


bt_navigator:
  ros__parameters:
    use_sim_time: True
    transform_tolerance: 0.1 #变换容差
    goal_reached_tol: 0.6 #接受姿势作为目标的容忍度(m)
    global_frame: map
    robot_base_frame: base_link             # 兼容层/仿真：真车是 base_footprint
    odom_topic: /odom                       # 兼容层/仿真：真车是 odom_combined
    bt_loop_duration: 10        #BT 执行每次迭代的持续时间（以毫秒为单位
    default_server_timeout: 1000  #兼容层：上游 20 ms 是按本机服务往返算的，这里的往返是共享内存发布 + 对端自己的活，20 ms 必然超时（表现为无谓的恢复分支）
    default_cancel_timeout: 1000
    #兼容层：行为树用移植版自带的两棵，路径由 bridge_env 的 NAV2_SHIM_BT_DIR 给出
    default_nav_to_pose_bt_xml: "$(env NAV2_SHIM_BT_DIR)/navigate_to_pose.xml"
    default_nav_through_poses_bt_xml: "$(env NAV2_SHIM_BT_DIR)/navigate_through_poses.xml"

    error_code_names:
    - compute_path_error_code
    - follow_path_error_code
# bt_navigator参数说明：https://docs.nav2.org/configuration/packages/configuring-bt-navigator.html?highlight=bt_navigator

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: True


controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.0
    # min_x_velocity_threshold: 0.295
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.1
    odom_topic: /odom                       # 兼容层/仿真：真车是 odom_combined
    #兼容层：nav2 1.5 默认在 /cmd_vel 上发 TwistStamped，兼容层按话题名转发、
    #按对端宣告的类型落地，而底盘的订阅方要的是普通 Twist —— 类型对不上时
    #TwistStamped 的字节被当成 Twist 读，linear.x 解出来是个接近 0 的非规格化数，
    #车一动不动而且不报错。这里把类型钉死成 Twist。
    enable_stamped_cmd_vel: false
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.6
      movement_time_allowance: 18.5
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 1.0
      yaw_goal_tolerance: 1.0
      stateful: True
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.22
      lookahead_dist: 0.3
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.6
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.4               #如果使用旋转至航向，则这是要使用的角速度。
      transform_tolerance: 1.0                         #TF 变换容差
      use_velocity_scaled_lookahead_dist: true        #是否使用速度缩放的前瞻距离或常数lookahead_distance
      min_approach_linear_velocity: 0.1               # 接近目标时应用的最小速度阈值(必须 <= desired_linear_vel)
      approach_velocity_scaling_dist: 0.68              # 距离变换路径末端的积分距离，在此距离处开始应用速度缩放。
      #注意：默认为代价地图的前向范围减去一个代价地图单元长度。
      use_collision_detection: true                     #是否启用碰撞检测（RPP 前向投影，真车应开启）。

      max_allowed_time_to_collision_up_to_carrot: 1.0  #use_collision_detection为真，投射速度命令以检查碰撞的时间true。它被限制为所选前瞻距离的最大距离。
      use_regulated_linear_velocity_scaling: true      #是否使用受控的曲率特征
      use_cost_regulated_linear_velocity_scaling: true #是否使用受管制的接近障碍物功能
      regulated_linear_scaling_min_radius: 0.6         #触发调节功能的转弯半径。请记住，转弯越急，半径就越小
      regulated_linear_scaling_min_speed: 0.10         #受调节特征能够发送的最小速度，必须 < desired_linear_vel(0.22)，否则减速逻辑自相矛盾
      use_rotate_to_heading: false                      # 使用完整规划器时是否启用旋转到粗略航向和目标方向。
      rotate_to_heading_min_angle: 0.785               #use_rotate_to_heading如果启用，则路径方向和起始机器人方向之间的差异将触发原地旋转。
      max_angular_accel: 1.0                           #旋转至航向时允许的最大角加速度（如果启用）
      max_robot_pose_search_dist: 3.0                 #沿路径搜索最接近机器人姿势的最大综合距离。#-->10.0
      #注意：默认设置为最大代价地图范围，因此除非本地代价地图内存在循环，否则不应手动设置。
      use_interpolation: true                         #启用路径上姿势之间的插值以进行前瞻点选择。帮助稀疏路径避免引起不连续的指令速度。
      cost_scaling_dist: 0.1 #use_cost_regulated_linear_velocity_scaling如果启用，则触发线速度缩放的最小障碍物距离。
      #注意：设置的值应小于或等于inflation_radiuscostmap 膨胀层中设置的值，因为膨胀用于计算与障碍物的距离
      cost_scaling_gain: 0.8 #乘数增益应小于或等于 1.0，用于在 范围内有障碍物时进一步调整速度cost_scaling_dist。
      #注意：值越低，减速越快。
      inflation_cost_scaling_factor: 3.0               #局部代价地图中膨胀层设置的值cost_scaling_factor。
      #注意：该值应与使用膨胀单元格值准确计算与障碍物的距离完全相同
      goal_dist_tol: 0.08
      # 不允许倒车
      allow_reversing: false
      #参数参考：https://github.com/ros-navigation/navigation2/blob/humble/nav2_regulated_pure_pursuit_controller/README.md

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0  #成本地图更新频率
      publish_frequency: 10.0 #将成本图发布到话题的频率
      global_frame: odom               #兼容层/仿真：真车是 odom_combined
      robot_base_frame: base_link      #兼容层/仿真：真车是 base_footprint
      use_sim_time: True  #仿真时间
      rolling_window: true #成本地图是否应随机器人基座框架滚动
      width: 4             #代价地图的宽度（m）
      height: 4            #代价地图的高度（m）
      resolution: 0.05     #代价地图1像素的分辨率，以米为单位
      robot_radius: 0.60   #机器人半径，如果未提供足迹坐标，则使用机器人半径。
      footprint: "[ [-0.32, -0.18], [-0.32, 0.18], [0.32,0.18], [0.32, -0.18] ]"
      plugins: ["voxel_layer","inflation_layer"] #插件包括:{“体素层”，“障碍层”，“膨胀层”}
      inflation_layer:                             #膨胀层参数
        plugin: "nav2_costmap_2d::InflationLayer"  #膨胀层插件。
        cost_scaling_factor: 10.0                   #成本缩放因子，决定障碍物成本随距离的递减速度。
        inflation_radius: 0.21                     #膨胀半径
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"      #体素层插件。
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0                              #体素地图的起始Z坐标
        z_resolution: 0.05                         #体素地图的Z轴分辨率
        z_voxels: 16                               #体素地图的Z轴体素数量
        max_obstacle_height: 2.0                   #可检测障碍物的最大高度（米）
        mark_threshold: 0                          #标记体素的阈值
        observation_sources: scan                  #观测源
        scan:
          topic: /scan
          max_obstacle_height: 2.0                  #可检测障碍物的最大高度（米）
          clearing: True                            #是否启用障碍物清除功能
          marking: True                             #是否启用障碍物标记功能
          data_type: "LaserScan"                    #数据类型
          raytrace_max_range: 10.0                  #控制光线追踪从代价地图中清除障碍物的最大范围
          raytrace_min_range: 0.0                   #控制光线追踪从代价地图中清除障碍物的最大范围
          obstacle_max_range: 2.5                   #控制代价地图上标记障碍物的最大范围
          obstacle_min_range: 0.1                   #控制代价地图上标记障碍物的最小范围

      always_send_full_costmap: False                 #是否每次更新时都发送完整的成本图，而不是更新
  local_costmap_client:
    ros__parameters:
      use_sim_time: True
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 10.0             #成本地图更新频率
      publish_frequency: 10.0            #将成本图发布到话题的频率
      global_frame: map                 #全局框架
      robot_base_frame: base_link       #兼容层/仿真：真车是 base_footprint
      use_sim_time: True                #仿真时间
      robot_radius: 0.60                #机器人半径
      footprint: "[ [-0.32, -0.18], [-0.32, 0.18], [0.32,0.18], [0.32, -0.18] ]"
      resolution: 0.2                  #全局地图1像素的分辨率，以米为单位
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"] #插件包括：{“静态层”，“障碍层”，“膨胀层”}
      obstacle_layer:  #障碍层参数
        plugin: "nav2_costmap_2d::ObstacleLayer" #障碍层插件
        enabled: True
        observation_sources: scan                  #观测源
        scan:
          topic: scan
          max_obstacle_height: 2.0                 #可检测障碍物的最大高度（米）
          clearing: True                           #是否启用障碍物清除功能
          marking: True                            #是否启用障碍物标记功能
          data_type: "LaserScan"                   #数据类型
          raytrace_max_range: 10.0                 #控制光线追踪从代价地图中清除障碍物的最大范围
          raytrace_min_range: 0.0                  #控制光线追踪从代价地图中清除障碍物的最大范围
          obstacle_max_range: 2.5                  #控制代价地图上标记障碍物的最大范围
          obstacle_min_range: 0.1                  #控制代价地图上标记障碍物的最小范围
      static_layer: #静态层参数
        plugin: "nav2_costmap_2d::StaticLayer"     #静态层插件
        map_subscribe_transient_local: True
      inflation_layer: #膨胀层参数
        plugin: "nav2_costmap_2d::InflationLayer"  #膨胀层插件
        cost_scaling_factor: 10.0                   #成本缩放因子，决定障碍物成本随距离的递减速度。
        # 这就是这份文件与真车共用的值，它 < 足迹外接半径 0.3808（底盘 0.64x0.36 的对角线）。
        # 于是上游 SmacPlannerHybrid 的 findCircumscribedCost() 会报「The inflation radius
        # (0.250000) is smaller than the circumscribed radius (0.380789)」，并把「只有成本高到
        # 外接半径那一档才做足迹碰撞检查」的快速路径退化成逐节点全文足迹检查（上游原话是
        # "substantially impact run-time performance"）。慢、日志吵，但结果正确：2026-09-19 实测
        # 9 个目标 15~32 ms，与 0.45 逐条同结果、逐条同耗时（见 03-validation.md 证据 72）。
        # 2026-09-18 曾因为「第 2 条及以后的规划抛 std::bad_alloc」把这行钉成 0.45；那个
        # bad_alloc 的根因 2026-09-19 已经定位并修掉（规划器自己算出的角度箱越界，见证据 72）——
        # 0.45 只是让走到那行代码的次数少一点，不是修复 —— 所以这里回到与真车共用的 0.25。
        inflation_radius: 0.25                     #膨胀半径
      always_send_full_costmap: True               #是否每次更新时都发送完整的成本图，而不是更新
  global_costmap_client:
    ros__parameters:
      use_sim_time: True
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True

map_server:
  ros__parameters:
    use_sim_time: True
    # 兼容层：地图默认由桥从对面镜像到 /map（仿真或真车发什么就有什么），所以这里
    # 留空 —— 空值表示「先不发地图，等 load_map 服务」。
    # 要从文件出图时给出地图路径，真车是 /root/Desktop/racecar/map/ai_map001.yaml，
    # 兼容层上例如 C:/Users/Administrator/Desktop/app/code/CPU/code/Desktop/racecar/map/ai_map001.yaml
    #（也可以不改文件，命令行覆盖：-p yaml_filename:=<路径>）。
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0                #尝试保存地图的超时时间（秒）
    free_thresh_default: 0.25            #占用网格的自由空间最大概率阈值
    occupied_thresh_default: 0.65        #占用网格的占用空间最小概率阈值
    map_subscribe_transient_local: True  #地图话题的 QoS 设置

planner_server: #规划器服务器参数
  ros__parameters:
    planner_plugins: ["GridBased"]
    use_sim_time: True
    expected_planner_frequency: 5.0     #预期的规划器频率。如果当前频率小于预期频率，则显示警告消息。
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid" #Smac Hybrid-A* 规划器
      tolerance: 0.1                      # 如果无法达到精确的姿势，则规划的容差(单位m)
      downsample_costmap: false           # 是否将代价图下采样至另一个分辨率以进行搜索
      downsampling_factor: 1              # 对代价图进行下采样的乘数因子
      allow_unknown: false                # 允许在未知空间搜索
      max_iterations: 1000000             # 失败前搜索的最大迭代次数（以防无法到达），设置为 -1 以禁用
      max_on_approach_iterations: 1000    # 在公差范围内尝试达到目标的最大迭代次数，仅限 2D
      max_planning_time: 7.0              # 规划器进行规划、平滑和上采样的最大时间（以秒为单位）。
      # 控制器 allow_reversing=false（不允许倒车），规划器必须用不产生倒车路径的 DUBIN
      motion_model_for_search: "DUBIN"    # 2D Moore, Von Neumann; Hybrid Dubin, Redds-Shepp; State Lattice set internally
      cost_travel_multiplier: 2.0         #应用于搜索以避开高成本区域的成本乘数。
      angle_quantization_bins: 64         #用于 SE2 搜索的角度箱数量。这可以是任何偶数，但好的基线是 64 或 72（以 5 度为增量）
      analytic_expansion_ratio: 4.0       #规划器将尝试以与该值和最小启发式方法成比例的频率完成分析扩展。
      minimum_turning_radius: 0.6        #最小转弯半径
      reverse_penalty: 10.0                #如果反向搜索，则对 SE2 节点应用启发式惩罚。
      change_penalty: 1.5                #如果在搜索中改变方向（例如从左到右），则对 SE2 节点应用启发式惩罚。
      non_straight_penalty: 1.50          #如果在非直线方向上搜索，则对 SE2 节点应用启发式惩罚。
      cost_penalty: 1.7                   #应用于 SE2 节点的姿势成本的启发式惩罚。
      lookup_table_size: 20.0               #距离窗口的缓存大小
      # 上游默认值，这里也回到它。2026-09-18 一度钉成 False，理由是「第二次及以后的规划
      # 抛 std::bad_alloc」；2026-09-19 根因定位（AnalyticExpansion 写出的角度箱越界，
      # 见 03-validation.md 证据 72）并修掉之后，true 与 false 的 9 个目标逐条同结果，
      # true 还省掉每次规划重算一遍障碍启发式（同一个到不了的目标 1.66~1.72 s vs 1.87~1.97 s）。
      cache_obstacle_heuristic: True       #缓存障碍启发式（上游默认）
      smoother:
        max_iterations: 2000 #平滑器平滑路径的最大迭代次数，以限制潜在的计算。
        w_smooth: 0.5 #应用于平滑数据点的平滑权重
        w_data: 0.1 #应用权重平滑以保留原始数据信息
        tolerance: 1.0e-12 #终止平滑会话的参数容差变化量
#参数参考：https://docs.nav2.org/configuration/packages/smac/configuring-smac-hybrid.html?highlight=nav2_smac_planner

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10 #TF transform tolerance.
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw           #用于在局部代价地图上进行碰撞检查的原始代价地图主题。
    footprint_topic: local_costmap/published_footprint #局部代价地图框架中的足迹发布主题。
    cycle_frequency: 10.0 #运行行为插件的频率。
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"] #插件包括：{“旋转”、“备份”、“前进”、“等待”}
    # 注意：Nav2 Humble 默认行为树 navigate_to_pose_w_replanning_and_recovery.xml
    # 里引用了 BackUp 节点。若直接从 behavior_plugins 去掉 backup，BT 会因找不到
    # 该节点而加载失败，导航服务整体起不来。因此 RPP 侧用 allow_reversing:false、
    # 规划器用不产生倒车路径的 DUBIN 来避免倒车；若要求任何情况都绝不倒车，需再
    # 提供一份去掉 BackUp 的自定义 BT XML 并设置 default_nav_to_pose_bt_xml。
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom                #兼容层/仿真：真车是 odom_combined
    robot_base_frame: base_link       #兼容层/仿真：真车是 base_footprint
    transform_tolerance: 0.1 #TF 变换容差
    use_sim_time: True
    #兼容层：同 controller_server 的 enable_stamped_cmd_vel —— 恢复分支上的
    #Spin / BackUp 也走 nav2_util::TwistPublisher，发 TwistStamped 的话同样到不了底盘
    enable_stamped_cmd_vel: false
    simulate_ahead_time: 5.0 #提前模拟
    max_rotational_vel: 1.0  #最大旋转速度（弧度/秒）
    min_rotational_vel: 0.0 #最小旋转速度（弧度/秒）
    rotational_acc_lim: 0.3  #最大旋转加速度（rad/s^2）

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20 #循环速率
    stop_on_failure: False #如果单个航点失败，是否使操作任务失败。如果为 false，将继续到下一个航点。
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200 #机器人到达每个航点后休眠/等待的时间（以毫秒为单位）
#waypoint_follower 参数参考
#https://docs.nav2.org/configuration/packages/configuring-waypoint-follower.html?highlight=stop_on_failure

# ============================================================================
# 兼容层新增段：上游 nav2_params.yaml 里没有 lifecycle_manager，这一段是
# nav2_bringup 的 launch 文件现传的（navigation_launch.py 的 node_names）。
# 兼容层上没有 launch，所以写进文件里。
#
# node_names 就是这一栈要拉起来的节点，顺序无关；amcl 不在其中 —— 兼容层的
# AMCL 由 amcl_bridge_node 自己驱动 configure/activate（见
# bridge/scripts/run_nav2_stack.py），它不属于 lifecycle_manager 的托管集合。
# 少了 behavior_server，两棵行为树的恢复叶子就没有 action server，
# bt_navigator 激活会直接失败（"Action server spin not available"）。
#
# bond_timeout: 0.0 是兼容层的取舍：这里的 bond 是空实现（共享内存垮了整个
# 进程也没了），重连/重启机制没有可监视的对象，置 0 关掉它的定时器。
# ============================================================================
lifecycle_manager:
  ros__parameters:
    use_sim_time: True
    autostart: true
    node_names:
      ["controller_server", "planner_server", "bt_navigator", "behavior_server",
       "smoother_server", "waypoint_follower"]
    bond_timeout: 0.0
    attempt_respawn_reconnection: false
