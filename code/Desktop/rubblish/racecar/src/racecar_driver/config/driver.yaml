racecar_driver:
  ros__parameters:
    serial_port: "/dev/car"
    baud_rate: 38400
    # 线速度限制：超过该值的 /car_cmd_vel 线速度无效（被限幅）并在底盘打印红色警告
    # 链条：PWM = v * 100 + 1500，所以 2.0 m/s 对应 PWM 1700
    max_linear_vel: 2.0
    min_linear_vel: -2.0
    # 超过该时间未收到 /car_cmd_vel 则输出停车指令（看门狗）
    cmd_vel_timeout: 0.5
    # PWM 硬件限幅(us)，防止计算值溢出 uint16_t
    min_motor_pwm: 1000
    max_motor_pwm: 2000
    min_servo_pwm: 500
    max_servo_pwm: 2500

    # Ackermann 运动学转向：delta = atan(wheelbase * angular.z / linear.x)
    # 前轮转角再按 steering_pwm_per_rad 标定成舵机 PWM。
    wheelbase: 0.305                # 前后轴距(m)
    steering_center_pwm: 1500.0     # 前轮居中时的舵机 PWM(us)
    steering_pwm_per_rad: 800.0     # 前轮转角(rad) -> 舵机 PWM 斜率(us/rad)
    max_steering_angle_rad: 0.5     # 前轮最大转角(rad)，约 28.6 度
    min_steering_speed: 0.05        # 低于该速度(m/s)不按 w/v 计算，走最大转角兜底

    # 控制权仲裁：auto=只认 /car_cmd_vel；manual=只认 /teleop_cmd_vel；
    # priority=遥控活跃时优先，遥控失联后交还自动驾驶（推荐）
    control_mode: "priority"
    teleop_timeout: 0.3             # 遥控失联判定(s)
